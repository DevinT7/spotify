name: Tempo
options:
  bundleIdPrefix: com.devinthenuwara
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Tempo:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: TempoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devinthenuwara.tempo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tempo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
  TempoWidgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devinthenuwara.tempo.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tempo
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Tempo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
